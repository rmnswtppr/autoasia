<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход и Регистрация — АвтоАзия</title>
    <link rel="icon" type="image/png" href="images/favicon1.png">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script> 
</head>
<body>
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">
                <img src="images/logo2.jpg" alt="logo AutoAsia" width="230" height="48">
            </a>
            <nav class="navigation">
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="catalog.html">Каталог</a></li>
                    <li><a href="reviews.html">Отзывы</a></li>
                    <li><a href="about.html">О нас</a></li>
                    <li><a href="cart.html" class="icon-link">🛒 Корзина</a></li>
                    <li><a href="auth.html" class="icon-link">👤 ЛК</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <section class="auth-section">
            <div class="auth-container">
                <!-- Переключатели вкладок -->
                <div class="auth-tabs">
                    <button class="auth-tab-btn active" data-auth-tab="login-form-block">Вход</button>
                    <button class="auth-tab-btn" data-auth-tab="register-form-block">Регистрация</button>
                </div>

                <!-- Блок Входа -->
                <div class="auth-form-content active" id="login-form-block">
                    <h3>Войти в личный кабинет</h3>
                    <form class="auth-form" id="login-form">
                        <div class="form-group">
                            <label for="login-email">E-mail *</label>
                            <input type="email" id="login-email" required placeholder="example@mail.ru">
                        </div>
                        <div class="form-group">
                            <label for="login-password">Пароль *</label>
                            <input type="password" id="login-password" required placeholder="Введите пароль">
                        </div>
                        <div class="auth-remember">
                            <label><input type="checkbox" name="remember"> Запомнить меня</label>
                        </div>
                        <button type="submit" class="submit-btn auth-btn">Войти</button>
                    </form>
                </div>

                <!-- Блок Регистрации -->
                <div class="auth-form-content" id="register-form-block">
                    <h3>Создать аккаунт</h3>
                    <form class="auth-form" id="register-form">
                        <div class="form-group">
                            <label for="reg-name">Ваше имя *</label>
                            <input type="text" id="reg-name" required placeholder="Иван Иванов">
                        </div>
                        <div class="form-group">
                            <label for="reg-phone">Телефон *</label>
                            <input type="tel" id="reg-phone" required placeholder="+7 (999) 999-99-99">
                        </div>
                        <div class="form-group">
                            <label for="reg-email">E-mail *</label>
                            <input type="email" id="reg-email" required placeholder="example@mail.ru">
                        </div>
                        <div class="form-group">
                            <label for="reg-password">Пароль *</label>
                            <input type="password" id="reg-password" required placeholder="Минимум 6 символов">
                        </div>
                        <div class="form-group">
                            <label for="reg-password-confirm">Повторите пароль *</label>
                            <input type="password" id="reg-password-confirm" required placeholder="Повторите пароль">
                        </div>
                        <button type="submit" class="submit-btn auth-btn">Зарегистрироваться</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Все права защищены.</p>
    </footer>
</body>
</html>
